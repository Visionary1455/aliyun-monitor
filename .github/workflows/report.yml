name: Aliyun ECS Daily Report

on:
  schedule:
    - cron: '0 9 * * *'  # 每天早上9点
  workflow_dispatch:       # 手动触发

env:
  PYTHON_VERSION: '3.11'

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install aliyun-python-sdk-core aliyun-python-sdk-ecs aliyun-python-sdk-bssopenapi requests

      - name: Run daily report
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_REGION: ${{ secrets.ALIYUN_REGION }}
          ECS_INSTANCE_ID: ${{ secrets.ECS_INSTANCE_ID }}
          CDT_TRAFFIC_LIMIT_GB: ${{ secrets.CDT_TRAFFIC_LIMIT_GB }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          INSTANCE_NAME: ${{ secrets.INSTANCE_NAME }}
          REPORT_HOUR: ${{ secrets.REPORT_HOUR }}
        run: python .github/workflows/report.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-logs
          path: ${{ github.workspace }}/report.log
          retention-days: 3