name: Aliyun ECS Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟执行
  workflow_dispatch:       # 手动触发
  repository_dispatch:
    types: [monitor]

env:
  PYTHON_VERSION: '3.11'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install aliyun-python-sdk-core aliyun-python-sdk-ecs aliyun-python-sdk-bssopenapi requests

      - name: Run monitor
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_REGION: ${{ secrets.ALIYUN_REGION }}
          ECS_INSTANCE_ID: ${{ secrets.ECS_INSTANCE_ID }}
          CDT_TRAFFIC_LIMIT_GB: ${{ secrets.CDT_TRAFFIC_LIMIT_GB }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python .github/workflows/monitor.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-logs
          path: monitor.log
          retention-days: 1