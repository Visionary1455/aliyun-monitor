name: Aliyun ECS Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟执行
  workflow_dispatch:       # 手动触发
  repository_dispatch:
    types: [monitor]

env:
  PYTHON_VERSION: '3.11'
  STATE_FILE: ${{ github.workspace }}/.state/monitor_state.json

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install aliyun-python-sdk-core aliyun-python-sdk-ecs aliyun-python-sdk-bssopenapi requests

      - name: Create state directory
        run: mkdir -p ${{ github.workspace }}/.state

      - name: Restore state file
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.state
          key: monitor-state-${{ secrets.ECS_INSTANCE_ID }}
          restore-keys: monitor-state-

      - name: Run monitor
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_REGION: ${{ secrets.ALIYUN_REGION }}
          ECS_INSTANCE_ID: ${{ secrets.ECS_INSTANCE_ID }}
          CDT_TRAFFIC_LIMIT_GB: ${{ secrets.CDT_TRAFFIC_LIMIT_GB }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          INSTANCE_NAME: ${{ secrets.INSTANCE_NAME }}
          STATE_FILE: ${{ env.STATE_FILE }}
          LOG_FILE: ${{ github.workspace }}/monitor.log
          REPORT_HOUR: ${{ secrets.REPORT_HOUR }}
        run: python .github/workflows/monitor.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-logs
          path: |
            ${{ github.workspace }}/.state/
            ${{ github.workspace }}/monitor.log
          retention-days: 3